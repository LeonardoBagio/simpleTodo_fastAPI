[tool.poetry]
name = "simple_todo"
version = "0.1.0"
description = ""
authors = ["Leonardo Bagio <leobagio2009@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
alembic = ">=1.18.5,<2.0.0"
fastapi = {extras = ["standard"], version = ">=0.139.0,<0.140.0"}
pwdlib = {extras = ["argon2"], version = "^0.3.1"}
pydantic-settings = ">=2.14.2,<3.0.0"
pyjwt = ">=2.13.0,<3.0.0"
aiosqlite = ">=0.22.1,<0.23.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.52"}
psycopg = {extras = ["binary"], version = ">=3.3.4,<4.0.0"}
tzdata = ">=2026.3,<2027.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.22,<0.16.0"
pytest = ">=9.1.1,<10.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
taskipy = ">=1.14.1,<2.0.0"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=fast_zero', '--cov-context=test']
asyncio_default_fixture_loop_scope = 'function'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev simple_todo/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=simple_todo -vv'
testAll = 'task format && task test'
post_test = 'coverage html'