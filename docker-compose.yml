services:
  db:
    image: postgres:16
    container_name: simple_todo_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-simple_todo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-simple_todo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: simple_todo_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-simple_todo}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: simple_todo_frontend
    depends_on:
      app:
        condition: service_started
    environment:
      # BFF proxy target — the browser only ever talks to this Nuxt service,
      # which reaches FastAPI over the internal compose network (no CORS needed).
      NUXT_BACKEND_URL: http://app:8000
      NUXT_PUBLIC_APP_NAME: ${APP_NAME:-Simple Todo}
    ports:
      - "3000:3000"

volumes:
  pgdata:
